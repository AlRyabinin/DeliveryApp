version: '3.8'

services:
  # Backend API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - sqlite_data:/app
    networks:
      - app-network

  # Frontend React
  client:
    build:
      context: ./src/DeliveryApp.Client
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - api
    networks:
      - app-network

volumes:
  sqlite_data:

networks:
  app-network:
    driver: bridge